name: Validate Godot
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.5.1-stable_linux.x86_64
      - name: Parse/import project
        run: godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Smoke test
        run: timeout 20s godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --quit-after 3

  deploy_pages:
    name: Export and deploy Web to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install Godot 4.5.1 and export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.5.1-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/4.5.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz -d templates
          cp -r templates/templates/* ~/.local/share/godot/export_templates/4.5.1.stable/
      - name: Export Web build
        run: |
          mkdir -p build/web
          godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-release "Web" build/web/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
