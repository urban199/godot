name: Build all platforms

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android export packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Godot 4.5.1 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot/engine.zip"
          unzip -q "$RUNNER_TEMP/godot/engine.zip" -d "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz \
            --output "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -R "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Import and validate project scripts
        run: Godot_v4.5.1-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Export Web, Windows, and Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web build/windows build/android
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-release "Web" build/web/index.html
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/windows/PROJECT_BLACK_RAIN.exe
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-release "Android APK" build/android/PROJECT_BLACK_RAIN.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: black-rain-${{ github.sha }}
          path: build/
          if-no-files-found: error
