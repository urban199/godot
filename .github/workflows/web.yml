name: Build Godot Web Preview

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.5.1

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs build/web
          curl --fail --location --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --output templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d templates
          cp templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import resources and validate character/gameplay
        shell: bash
        run: |
          set -euo pipefail
          GODOT="./Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$GODOT" --headless --editor --path . --import 2>&1 | tee logs/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' logs/import.log; then exit 1; fi

      - name: Export Web Preview
        shell: bash
        run: |
          set -euo pipefail
          ./"Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release Web build/web/index.html 2>&1 | tee logs/web-export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' logs/web-export.log; then exit 1; fi

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-godot-web-${{ github.sha }}
          path: |
            build/web/
            logs/
          if-no-files-found: error
