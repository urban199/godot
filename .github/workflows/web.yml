name: Build Godot Web Preview

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.5.1

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned Godot and export templates
        shell: bash
        run: |
          curl --fail --location --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --output templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d templates
          cp templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Export Web
        run: |
          mkdir -p build/web
          ./"Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --editor --quit
          ./"Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release Web build/web/index.html

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-godot-web-${{ github.sha }}
          path: build/web
