name: Generate and Validate Neko Nightfall Character

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/characters/generate_genshin_style_character.py'
      - '.github/workflows/generate-character.yml'

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
          blender -b --python-expr "import numpy; print('Blender NumPy:', numpy.__version__)"

      - name: Generate the rigged character
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build logs
          NEKO_OUTPUT="$GITHUB_WORKSPACE/build/neko_nightfall_genshin_style.glb" \
            blender -b --python tools/characters/generate_genshin_style_character.py \
            2>&1 | tee logs/blender-generation.log
          test -s build/neko_nightfall_genshin_style.glb

      - name: Stage generated GLB at the runtime destination
        shell: bash
        run: |
          set -euo pipefail
          TARGET='assets/characters/player/neko_nightfall_anime_complete/models/neko_nightfall_genshin_style.glb'
          cp build/neko_nightfall_genshin_style.glb "$TARGET"
          test -s "$TARGET"

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Import project and validate generated character in gameplay
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --import 2>&1 | tee logs/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' logs/godot-import.log; then
            echo 'Godot resource import reported an error.'
            exit 1
          fi
          ./godot --headless --path . --script res://scripts/ci/validate_character.gd \
            2>&1 | tee logs/character-validation.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' logs/character-validation.log; then
            echo 'Generated character validation reported an error.'
            exit 1
          fi

      - name: Upload generated character and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neko-nightfall-genshin-style-${{ github.sha }}
          path: |
            assets/characters/player/neko_nightfall_anime_complete/models/neko_nightfall_genshin_style.glb
            logs/
          if-no-files-found: error

      - name: Commit generated character to the triggering branch
        shell: bash
        run: |
          set -euo pipefail
          TARGET='assets/characters/player/neko_nightfall_anime_complete/models/neko_nightfall_genshin_style.glb'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$TARGET"
          if git diff --cached --quiet; then
            echo 'Generated character is unchanged; no commit is needed.'
            exit 0
          fi
          git commit -m 'chore: generate Neko Nightfall character model'
          git push origin "HEAD:${GITHUB_REF_NAME}"
