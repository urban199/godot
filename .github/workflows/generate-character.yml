name: Rig and Validate anime-model.glb

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/characters/player/anime-model.glb'
      - 'tools/characters/rig_anime_model.py'
      - 'scripts/humanoid_visual.gd'
      - 'scripts/ci/validate_character.gd'
      - '.github/workflows/generate-character.yml'

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1

jobs:
  rig-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender and its Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
          blender -b --python-expr "import numpy; print('Blender NumPy:', numpy.__version__)"

      - name: Generate rig, weights, and distinct animation clips from anime-model.glb
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build logs
          NEKO_INPUT="$GITHUB_WORKSPACE/assets/characters/player/anime-model.glb" \
          NEKO_OUTPUT="$GITHUB_WORKSPACE/build/anime-model-rigged.glb" \
            blender -b --python tools/characters/rig_anime_model.py \
            2>&1 | tee logs/blender-generation.log
          test -s build/anime-model-rigged.glb

      - name: Stage generated model as the sole runtime character
        shell: bash
        run: |
          set -euo pipefail
          cp build/anime-model-rigged.glb assets/characters/player/anime-model.glb
          test -s assets/characters/player/anime-model.glb

      - name: Download Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Import project and validate model and gameplay integration
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --editor --path . --import 2>&1 | tee logs/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' logs/godot-import.log; then
            echo 'Godot resource import reported an error.'
            exit 1
          fi
          ./godot --headless --path . --script res://scripts/ci/validate_character.gd \
            2>&1 | tee logs/character-validation.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' logs/character-validation.log; then
            echo 'Character validation reported an error.'
            exit 1
          fi

      - name: Upload model and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anime-model-rigged-${{ github.sha }}
          path: |
            assets/characters/player/anime-model.glb
            logs/
          if-no-files-found: error

      - name: Commit validated rigged model
        shell: bash
        run: |
          set -euo pipefail
          TARGET='assets/characters/player/anime-model.glb'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$TARGET"
          if git diff --cached --quiet; then
            echo 'Generated model is unchanged; no commit is needed.'
            exit 0
          fi
          git commit -m 'chore: rig and animate anime character model'
          git push origin "HEAD:${GITHUB_REF_NAME}"
