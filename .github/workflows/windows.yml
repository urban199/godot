name: Build Godot Windows

on:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Godot
        run: |
          curl --fail --location --output godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Export Windows
        run: mkdir -p build/windows && ./"Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release "Windows Desktop" build/windows/NekoGodotAI.exe
      - uses: actions/upload-artifact@v4
        with:
          name: neko-godot-windows-${{ github.sha }}
          path: build/windows/NekoGodotAI.exe
