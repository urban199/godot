name: Deploy Godot Webview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs build/web
          curl --fail --location --output godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --output templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d templates
          cp templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import and validate project startup
        shell: bash
        run: |
          set -euo pipefail
          GODOT="./Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$GODOT" --headless --editor --path . --import 2>&1 | tee logs/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' logs/import.log; then exit 1; fi
          "$GODOT" --headless --path . --quit-after 3 2>&1 | tee logs/project-startup.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' logs/project-startup.log; then exit 1; fi

      - name: Validate gameplay vertical slice
        shell: bash
        run: |
          set -euo pipefail
          ./"Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --script res://scripts/ci/validate_gameplay.gd 2>&1 | tee logs/gameplay-validation.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' logs/gameplay-validation.log; then exit 1; fi

      - name: Export Web Preview
        shell: bash
        run: |
          set -euo pipefail
          ./"Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release Web build/web/index.html 2>&1 | tee logs/web-export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' logs/web-export.log; then exit 1; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Upload Pages validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-validation-logs-${{ github.sha }}
          path: logs/
          if-no-files-found: warn
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
